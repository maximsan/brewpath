include: package:very_good_analysis/analysis_options.yaml

# Native analysis_server_plugins (no custom_lint), resolved in isolated envs.
plugins:
  riverpod_lint: ^3.1.3
  dart_code_linter: ^4.1.2

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    # Drift schema snapshots, emitted by `drift_dev schema generate` and
    # committed so migration tests can instantiate historical schemas. The
    # current generator writes raw `TableInfo`, which trips strict-raw-types;
    # they are build output, not code we maintain.
    - "test/generated/**"
    # Build artifacts — SwiftPM/CocoaPods copy plugin sources into build dirs
    # at the package root (build/) and under platform dirs (e.g. ios/build/).
    - "build/**"
    - "**/build/**"
  errors:
    invalid_annotation_target: ignore

linter:
  rules:
    # very_good_analysis re-enables cascade_invocations; keep it off — it fights
    # the CustomPainter draw sequences (roasty.dart) and isn't auto-fixable.
    cascade_invocations: false
    # pubspec deps are grouped by concern with explanatory comments (State / Nav
    # / Persistence / Firebase …); alphabetical sorting would scatter the groups.
    sort_pub_dependencies: false

# dart_code_linter — magic-number + per-function/class size & complexity that the
# stock linter can't enforce. CustomPainter / animation-geometry and theme-token
# files are excluded from no-magic-number (their literals are coordinates/tokens).
dart_code_linter:
  metrics:
    cyclomatic-complexity: 20
    maximum-nesting-level: 5
    number-of-parameters: 5
    # 90 (not DCM's default 50): measured declarative `build` methods here — the
    # collapsing profile header, preference/stat tiles — legitimately run 75–90
    # lines of widget tree with no branching. cyclomatic-complexity (20) and
    # maximum-nesting-level (5) stay strict; they guard real logic, SLOC doesn't.
    source-lines-of-code: 90
    number-of-methods: 12
  metrics-exclude:
    - test/**
    - integration_test/**
    # CustomPainter with many small _paintX helpers — method count is by design.
    - lib/features/companion/presentation/roasty.dart
    - lib/features/companion/presentation/roasty_body.dart
    - lib/features/companion/presentation/roasty_faces.dart
    - lib/features/companion/presentation/roasty_particles.dart
    # Declarative GoRouter route table — long by nature, low logic complexity.
    - lib/app/app_router.dart
    # A flat 13-token colour table. Its constructor, copyWith, lerp, == and
    # hashCode each restate all 13 by definition, so number-of-parameters (5)
    # and source-lines-of-code (90) measure the token count, not complexity.
    - lib/shared/theme/mood_colors.dart
    # A flat sealed union with one factory per authored card kind. Its method
    # count (15) is the kind count (14) plus fromJson, so number-of-methods (12)
    # measures the prototype's content design rather than anything about this
    # file. Splitting the union to satisfy the metric would forfeit the exhaustive
    # switch that makes an unhandled kind a compile error.
    - lib/shared/models/content/content_card.dart
    # The progress scope's one hand-listed copy. Its parameter count is, by
    # design, the number of fields that have a writer — the class deliberately
    # exposes no general `copyWith`, because an arbitrary replace is the one
    # operation a scope of monotonic fields must not offer. Splitting `_copy`
    # would mean a second hand-listed copy of every field, which is exactly
    # the duplication that once left `main` uncompilable.
    - lib/shared/storage/snapshot/snapshot_scopes.dart
  rules:
    - no-magic-number:
        severity: warning
        allowed: [0, 1, 2]
        exclude:
          # The coffee-bean gauge: an SVG path transcribed coordinate-for-
          # coordinate from `prototype/flavor-wheel.jsx`. Naming each bezier
          # control point would invent twelve constants that mean nothing on
          # their own and would hide the one property that matters — that the
          # numbers still match the design source exactly.
          - lib/core/widgets/bean_gauge.dart
          # The eight visual guides' drawings. Every literal in them is a
          # fraction of the box they are given — the normalisation that makes
          # one drawing serve both the row thumbnail and the sheet
          # illustration. Naming them would produce a constant per coordinate
          # per guide, each meaningless alone, and would hide the property
          # that matters: that nothing in them is a pixel.
          - lib/features/path/presentation/guide_marks/beans_marks.dart
          - lib/features/path/presentation/guide_marks/brew_marks.dart
          - lib/features/path/presentation/guide_marks/grind_marks.dart
          - lib/features/path/presentation/guide_marks/guide_mark.dart
          - lib/features/path/presentation/guide_marks/roast_marks.dart
          - lib/features/path/presentation/visual_guide_art.dart
          # The green bean a bagpick round draws, on the design source's own
          # 24x24 grid. Its literals are that grid — ellipse radii, the two
          # bezier curves of the centre cut, and the hash constants of the
          # noise the authored bags were tuned against. Naming them would
          # invent a constant per coordinate and hide the property that
          # matters: that they still match `prototype/bean-anatomy.jsx`.
          - lib/features/lessons/presentation/cards/bagpick_bean.dart
          - lib/features/lessons/presentation/cards/bagpick_bean_view.dart
          - lib/features/companion/presentation/roasty.dart
          - lib/features/companion/presentation/roasty_animation.dart
          - lib/features/companion/presentation/roasty_body.dart
          - lib/features/companion/presentation/roasty_faces.dart
          - lib/features/companion/presentation/roasty_particles.dart
          - lib/features/onboarding/presentation/loading/widgets/roasty_stage.dart
          - lib/features/onboarding/presentation/loading/loading_animation.dart
          - lib/shared/theme/app_spacing.dart
          - lib/shared/theme/app_radii.dart
          - lib/shared/theme/app_text.dart
          - lib/shared/theme/mood_colors.dart
          - lib/shared/theme/art_colors.dart
          - lib/shared/theme/overlay_colors.dart
          - lib/shared/theme/off_token.dart
