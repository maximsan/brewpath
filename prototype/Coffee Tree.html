<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>BrewPath — Coffee Tree</title>
<script>
  // Apply saved theme before first paint (shared with the rest of the app).
  (function(){
    try {
      var pref = localStorage.getItem('cq-theme') || 'dark';
      var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var isDark = pref === 'dark' || (pref === 'system' && sysDark);
      if (isDark) document.documentElement.setAttribute('data-mood', 'dark-roast');
      else document.documentElement.setAttribute('data-mood', 'cupping');
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #F4EFE6;
    --surface:   #FBF7EE;
    --surface-2: #EFE8DA;
    --ink:       #1B1614;
    --ink-mute:  #6B5F54;
    --rule:      #D8CFBF;
    /* Darkened from #B8533A so the accent clears AA as TEXT at 11px. */
    --accent:    #A6462F;
    --accent-ink:#FBF7EE;
    /* Deprecated alias, kept for the shipped mobile token set. */
    --accent-text: var(--accent);
    --sage:      #5F6E55;
    --warn:      #9A5F1C;
    --berry:     #A8362A;
    --r:         14px;
  }
  [data-mood="dark-roast"] {
    --bg:        #1A130E;
    --surface:   #251B14;
    --surface-2: #30231A;
    --ink:       #F3E7D2;
    --ink-mute:  #B59E84;
    --rule:      #44321E;
    --accent:    #E07A4F;
    --accent-ink:#1A130E;
    /* Deprecated alias. */
    --accent-text: var(--accent);
    --sage:      #97A285;
    --warn:      #E6A35C;
    --berry:     #C75450;
    --cream:     #F0DCB8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: #2a2622;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { opacity: 0.75; }

  .stage-wrap { display: flex; flex-direction: column; align-items: center; gap: 20px; }

  /* Phone */
  .phone {
    width: 393px;
    height: 852px;
    border-radius: 56px;
    background: var(--bg);
    position: relative;
    overflow: hidden;
    box-shadow:
      0 0 0 12px #0a0807,
      0 0 0 13px #2a2622,
      0 50px 100px rgba(0,0,0,0.5),
      0 0 0 14px rgba(255,255,255,0.04);
    color: var(--ink);
  }
  .dynamic-island {
    position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
    width: 124px; height: 36px; background: #000; border-radius: 22px; z-index: 100;
  }
  .status-bar {
    position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 32px 0; font-size: 15px; font-weight: 600; color: var(--ink);
    pointer-events: none;
  }
  .status-bar .icons { display: flex; align-items: center; gap: 6px; }
  .status-bar .icons svg { fill: var(--ink); }

  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
  .topbar {
    position: absolute; top: 54px; left: 0; right: 0; padding: 12px 20px;
    display: grid; grid-template-columns: 32px 1fr auto; align-items: center;
    z-index: 10; background: transparent;
  }
  .icon-btn {
    appearance: none; background: transparent; border: none; cursor: pointer;
    color: var(--ink); padding: 4px; display: flex; align-items: center; justify-content: center;
  }
  .topbar .title {
    text-align: center; font-family: 'IBM Plex Sans', sans-serif; font-size: 12px;
    font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-mute);
  }
  .scroll {
    flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
    padding-top: 100px; padding-bottom: 20px;
  }
  .scroll::-webkit-scrollbar { display: none; }
  .home-indicator {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 134px; height: 5px; border-radius: 100px; background: var(--ink);
    opacity: 0.85; z-index: 90; pointer-events: none;
  }

  .ff-display { font-family: 'Fraunces', serif; font-optical-sizing: auto; }
  .ff-mono    { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }
  .smallcaps {
    font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 500;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-mute);
  }
  .px-24 { padding-left: 24px; padding-right: 24px; }

  /* ── Hero tree stage ── */
  .tree-hero {
    position: relative; width: 194px; height: 194px; margin: 0 auto;
    display: flex; align-items: center; justify-content: center;
  }
  .tree-ground {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 62%,
      color-mix(in oklab, var(--surface) 96%, var(--accent) 5%) 0%,
      color-mix(in oklab, var(--surface) 55%, transparent) 40%, transparent 66%);
    border-radius: 999px;
  }
  .tree-hero img {
    position: absolute; width: 100%; height: 100%; object-fit: contain;
    transform-origin: 50% 86%;
  }
  #treeBase { z-index: 1; }
  #treeNext { z-index: 2; opacity: 0; }
  .tree-sway { animation: sway 6s ease-in-out infinite; }
  @keyframes sway { 0%,100% { transform: rotate(-0.8deg); } 50% { transform: rotate(0.8deg); } }
@keyframes bounce {
    0% { transform: scale(0.9); } 55% { transform: scale(1.05); }
    78% { transform: scale(0.985); } 100% { transform: scale(1); }
  }
  .tree-bounce { animation: bounce 620ms cubic-bezier(0.2,1.4,0.4,1) both; transform-origin: 50% 86%; }
  .glow-ring {
    position: absolute; inset: 12%; border-radius: 999px; z-index: 0; opacity: 0; pointer-events: none;
    background: radial-gradient(circle, color-mix(in oklab, var(--accent) 45%, transparent) 0%, transparent 70%);
  }
  .glow-ring.go { animation: glow 950ms ease-out both; }
  @keyframes glow {
    0% { opacity: 0; transform: scale(0.6); } 40% { opacity: 0.85; }
    100% { opacity: 0; transform: scale(2.1); }
  }
  .leaf {
    position: absolute; width: 9px; height: 9px; border-radius: 0 100% 0 100%;
    background: var(--sage); z-index: 3; pointer-events: none; opacity: 0;
  }
  .leaf.go { animation: leafDrift 1400ms ease-out both; }
  @keyframes leafDrift {
    0% { opacity: 0; transform: translate(0,0) rotate(0deg) scale(0.6); }
    25% { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(220deg) scale(1); }
  }

  .stage-name {
    font-family: 'Fraunces', serif; font-size: 30px; font-weight: 400; line-height: 1.05;
    letter-spacing: -0.02em; margin: 2px 0 0; color: var(--ink); text-align: center;
    transition: opacity 240ms ease;
  }

  /* ── Milestone timeline ── */
  .milestones { display: flex; flex-direction: column; }
  .ms-row {
    position: relative; display: grid; grid-template-columns: 46px 1fr auto;
    align-items: center; gap: 14px; padding: 11px 4px 11px 0;
    border-bottom: 1px solid var(--rule);
  }
  .ms-row:last-child { border-bottom: none; }
  .ms-row::before {
    content: ''; position: absolute; left: 22.5px; top: 0; bottom: 0; width: 1px;
    background: var(--rule); z-index: 0;
  }
  .ms-row:first-child::before { top: 50%; }
  .ms-row:last-child::before  { bottom: 50%; }
  .ms-thumb {
    position: relative; z-index: 1; width: 46px; height: 46px; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--rule);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .ms-thumb img { width: 86%; height: 86%; object-fit: contain; }
  .ms-row.done .ms-thumb { border-color: var(--sage); }
  /* Locked rows are distinguished by colour and a flattened thumb, never by
     opacity — a dimmed row is an unreadable row, and the map is the content. */
  .ms-row.locked .ms-mod { color: var(--ink-mute); font-weight: 400; }
  .ms-row.locked .ms-thumb { background: var(--surface-2); }
  .ms-row.locked .ms-thumb img { opacity: 0.45; filter: grayscale(1); }
  .ms-row.next .ms-thumb {
    border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent);
  }
  .ms-mod {
    font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; font-weight: 500; color: var(--ink);
  }
  .ms-sub {
    font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-mute); margin-top: 3px;
  }
  .ms-tag {
    font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em;
    text-transform: uppercase; white-space: nowrap; color: var(--ink-mute);
  }
  .ms-row.done .ms-tag { color: var(--sage); }
  .ms-row.next .ms-tag { color: var(--accent-text); font-weight: 600; }
  .ms-check {
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  }

  .btn {
    appearance: none; border: none; cursor: pointer; font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 500; font-size: 15px; letter-spacing: 0.02em; width: 100%;
    transition: transform 120ms ease, opacity 120ms ease;
  }
  .btn:active { transform: scale(0.985); }
  .btn-primary {
    background: var(--accent); color: var(--accent-ink); border-radius: var(--r); padding: 16px 24px;
  }
  .btn-primary:disabled { opacity: 0.4; cursor: default; }
  /* Demo controls live in the top bar so the whole growth story fits one screen. */
  .demo-ctl { display: flex; align-items: center; gap: 6px; justify-self: end; }
  .ctl {
    position: relative; appearance: none; cursor: pointer; width: 34px; height: 34px; border-radius: 999px;
    display: grid; place-items: center; background: var(--surface);
    border: 1px solid var(--rule); color: var(--ink);
    transition: transform 120ms ease, opacity 120ms ease, border-color 120ms ease;
  }
  /* 34px circle, 44px target — the ring stays small without shrinking the tap area. */
  .ctl::after { content: ''; position: absolute; inset: -5px; border-radius: 999px; }
  .ctl:active { transform: scale(0.94); }
  .ctl.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .ctl:disabled { opacity: 0.35; cursor: default; }

  .caption { color: rgba(255,255,255,0.4); font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; }

  @media (prefers-reduced-motion: reduce) {
    .tree-sway, .tree-bounce, .glow-ring.go, .leaf.go { animation: none !important; }
  }
</style>
</head>
<body>

<div class="stage-wrap">
  <div class="phone" data-screen-label="Coffee Tree — Growth Journey">
    <div class="dynamic-island"></div>
    <div class="status-bar">
      <span class="ff-mono">9:41</span>
      <div class="icons">
        <svg width="17" height="11" viewBox="0 0 17 11"><rect x="0" y="7.5" width="3" height="3.5" rx="0.6"/><rect x="4.5" y="5.5" width="3" height="5.5" rx="0.6"/><rect x="9" y="3" width="3" height="8" rx="0.6"/><rect x="13.5" y="0" width="3" height="11" rx="0.6"/></svg>
        <svg width="16" height="11" viewBox="0 0 16 11"><path d="M8 3a8 8 0 015.7 2.4l1.3-1.3A10 10 0 008 1 10 10 0 001 4.1l1.3 1.3A8 8 0 018 3zm0 3.6a4.4 4.4 0 013.2 1.4l1.3-1.3A6.2 6.2 0 008 4.7a6.2 6.2 0 00-4.5 1.9l1.3 1.3A4.4 4.4 0 018 6.6z"/><circle cx="8" cy="9.5" r="1.4"/></svg>
        <svg width="25" height="11" viewBox="0 0 25 11"><rect x="0.5" y="0.5" width="21" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-opacity="0.4"/><rect x="2" y="2" width="18" height="7" rx="1.5"/><rect x="22.5" y="3.5" width="1.5" height="4" rx="0.6" fill-opacity="0.4"/></svg>
      </div>
    </div>

    <div class="screen">
      <div class="topbar">
        <button class="icon-btn" aria-label="Back">
          <svg width="18" height="18" viewBox="0 0 18 18"><path d="M11 3 L5 9 L11 15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="title">Coffee Tree</div>
        <div class="demo-ctl">
          <button class="ctl" id="resetBtn" title="Reset growth" aria-label="Reset growth">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2.6 8a5.4 5.4 0 1 0 1.9-4.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M2.2 2.2v2.6h2.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="ctl primary" id="growBtn" title="Grow" aria-label="Grow">
            <svg width="14" height="14" viewBox="0 0 14 14"><path d="M4 2.6 L11.2 7 L4 11.4 Z" fill="currentColor"/></svg>
          </button>
        </div>
      </div>

      <div class="scroll">
        <div class="tree-hero" id="treeHero">
          <div class="tree-ground"></div>
          <div class="glow-ring" id="glow"></div>
          <img id="treeBase" class="tree-sway" src="assets/trees/1.png" alt="Coffee tree" />
          <img id="treeNext" src="assets/trees/1.png" alt="" />
        </div>

        <h1 class="stage-name" id="stageName">Seed</h1>
        <div style="text-align:center; margin-top:8px;">
          <span class="smallcaps" id="stageCount">STAGE 1 OF 10 · NOT STARTED</span>
        </div>

        <div class="px-24" style="padding-top:24px;">
          <div class="milestones" id="milestones"></div>
        </div>

        <div class="px-24" style="padding-top:16px; padding-bottom:8px;">
          <p style="margin:0; font-size:14px; line-height:1.5; color:var(--ink-mute); text-wrap:pretty;">
            Each module grows the tree twice — once at its halfway point, once when you finish it. Brew is the exception: its one step is the harvest.
          </p>
        </div>
      </div>
    </div>

    <div class="home-indicator"></div>
  </div>

  <div class="caption">BREWPATH · GROWTH JOURNEY · iPhone 15</div>
</div>

<script src="data.jsx"></script>
<script>
(function(){
  // Real data, one source of truth: module names and lesson counts come from
  // data.jsx (window.MODULES), and the stage mapping from window.TREE_THRESHOLDS /
  // window.treeStageFromCore — the same functions the app uses. Nothing about the
  // growth curve is restated here.
  // Frame names: window.STAGE_NAMES lives in flavor-wheel.jsx, which needs React,
  // so this page carries the same list as a fallback.
  var STAGE_NAMES = (window.STAGE_NAMES && window.STAGE_NAMES.length
    ? window.STAGE_NAMES
    : ['SEED','SPROUT','SAPLING','BUDDING','FLOWERING',
       'GREEN CHERRY','TURNING','RIPENING','NEAR HARVEST','HARVEST']
  ).map(function(n){ return n.charAt(0) + n.slice(1).toLowerCase(); });
  var MODS = window.MODULES || [];
  var THRESHOLDS = window.TREE_THRESHOLDS || [];
  var TOTAL = window.CORE_TOTAL || 0;

  // One entry per growth event, derived: the lesson count that triggers it, the
  // module it falls in, and whether it is that module's halfway or completion.
  var STEPS = THRESHOLDS.map(function(done){
    var at = 0, mod = MODS[0];
    for (var i = 0; i < MODS.length; i++){
      var size = MODS[i].lessons.length;
      if (done <= at + size) { mod = MODS[i]; break; }
      at += size;
    }
    return { done: done, stage: window.treeStageFromCore(done), mod: mod,
             kind: done === at + mod.lessons.length ? 'done' : 'mid' };
  });
  // Each module's own span of stages, read back off the derived steps.
  var MOD_SPAN = MODS.map(function(m){
    var mine = STEPS.filter(function(s){ return s.mod === m; });
    return { mod: m, first: mine[0].stage, last: mine[mine.length - 1].stage, steps: mine.length };
  });
  var STORE = 'cq-tree-steps';

  var base = document.getElementById('treeBase');
  var next = document.getElementById('treeNext');
  var glow = document.getElementById('glow');
  var hero = document.getElementById('treeHero');
  var stageName = document.getElementById('stageName');
  var stageCount = document.getElementById('stageCount');
  var msWrap = document.getElementById('milestones');
  var growBtn = document.getElementById('growBtn');
  var resetBtn = document.getElementById('resetBtn');

  function read(){
    var n = parseInt(localStorage.getItem(STORE) || '0', 10);
    return isNaN(n) ? 0 : Math.max(0, Math.min(STEPS.length, n));
  }
  function write(n){ try { localStorage.setItem(STORE, String(n)); } catch(e){} }

  var step = read();
  var animating = false;

  function stageOf(s){ return s === 0 ? 1 : STEPS[s - 1].stage; }
  function check(color){
    return '<svg width="13" height="13" viewBox="0 0 13 13"><path d="M2.5 7 L5 9.5 L10.5 3.5" fill="none" stroke="'+color+'" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }
  function statusLine(){
    var where;
    if (step === 0) where = 'NOT STARTED';
    else if (step === STEPS.length) where = 'COURSE COMPLETE';
    else {
      var last = STEPS[step - 1];
      where = last.kind === 'mid'
        ? 'HALFWAY THROUGH ' + last.mod.title.toUpperCase()
        : last.mod.title.toUpperCase() + ' COMPLETE';
    }
    return 'STAGE ' + stageOf(step) + ' OF 10 · ' + where;
  }
  function nextLabel(){
    if (step >= STEPS.length) return 'Fully grown — harvest ready';
    var nx = STEPS[step];
    return nx.kind === 'mid' ? 'Reach halfway in ' + nx.mod.title : 'Finish ' + nx.mod.title;
  }

  function renderMilestones(){
    var reached = stageOf(step);
    var nextMod = step < STEPS.length ? STEPS[step].mod : null;
    msWrap.innerHTML = MOD_SPAN.map(function(sp){
      var done = reached >= sp.last;
      var isNext = !done && sp.mod === nextMod;
      var cls = done ? 'done' : (isNext ? 'next' : 'locked');
      var tag = done ? '<span class="ms-check">'+check('var(--sage)')+' GROWN</span>'
                     : (isNext ? 'NEXT' : 'LOCKED');
      var span = (sp.steps > 1 ? 'STAGES ' + sp.first + '–' + sp.last : 'STAGE ' + sp.last)
        + ' · ' + sp.mod.lessons.length + ' LESSONS';
      return '<div class="ms-row '+cls+'">'
        + '<div class="ms-thumb"><img src="assets/trees/'+sp.last+'.png" alt=""></div>'
        + '<div><div class="ms-mod">'+sp.mod.title+'</div><div class="ms-sub">'+span+'</div></div>'
        + '<div class="ms-tag">'+tag+'</div></div>';
    }).join('');
  }

  function paintStatic(){
    var s = stageOf(step);
    base.src = 'assets/trees/' + s + '.png';
    stageName.textContent = STAGE_NAMES[s - 1];
    stageCount.textContent = statusLine();
    growBtn.title = nextLabel();
    growBtn.setAttribute('aria-label', nextLabel());
    growBtn.disabled = step >= STEPS.length;
    resetBtn.disabled = step === 0;
    renderMilestones();
  }

  function spawnLeaves(){
    for (var i = 0; i < 7; i++){
      var leaf = document.createElement('span');
      leaf.className = 'leaf';
      var ang = (Math.PI * (0.15 + Math.random() * 0.7));
      var dist = 60 + Math.random() * 70;
      leaf.style.left = (46 + Math.random() * 30) + '%';
      leaf.style.top = (40 + Math.random() * 20) + '%';
      leaf.style.setProperty('--dx', (Math.cos(ang) * (Math.random() < 0.5 ? -1 : 1) * dist) + 'px');
      leaf.style.setProperty('--dy', (-Math.abs(Math.sin(ang)) * dist * 0.4 - 20) + 'px');
      leaf.style.background = Math.random() < 0.4 ? 'var(--warn)' : 'var(--sage)';
      hero.appendChild(leaf);
      (function(l){ requestAnimationFrame(function(){ l.classList.add('go'); });
        setTimeout(function(){ l.remove(); }, 1500); })(leaf);
    }
  }

  function grow(){
    if (animating || step >= STEPS.length) return;
    animating = true;
    growBtn.disabled = true;

    step += 1;
    write(step);
    var s = stageOf(step);

    next.src = 'assets/trees/' + s + '.png';
    next.style.opacity = '0';
    base.classList.remove('tree-sway');

    requestAnimationFrame(function(){
      next.style.transition = 'opacity 620ms ease';
      base.style.transition = 'opacity 620ms ease';
      next.style.opacity = '1';
      base.style.opacity = '0';
    });

    stageName.style.opacity = '0';

    setTimeout(function(){
      glow.classList.remove('go'); void glow.offsetWidth; glow.classList.add('go');
      spawnLeaves();
      hero.classList.remove('tree-bounce'); void hero.offsetWidth; hero.classList.add('tree-bounce');
      stageName.textContent = STAGE_NAMES[s - 1];
      stageName.style.opacity = '1';
      stageCount.textContent = statusLine();
    }, 260);

    setTimeout(function(){
      base.src = 'assets/trees/' + s + '.png';
      base.style.transition = 'none';
      base.style.opacity = '1';
      next.style.transition = 'none';
      next.style.opacity = '0';
      base.classList.add('tree-sway');
      hero.classList.remove('tree-bounce');
      renderMilestones();
      growBtn.title = nextLabel();
      growBtn.setAttribute('aria-label', nextLabel());
      growBtn.disabled = step >= STEPS.length;
      resetBtn.disabled = false;
      animating = false;
    }, 900);
  }

  growBtn.addEventListener('click', grow);
  resetBtn.addEventListener('click', function(){
    if (animating) return;
    step = 0; write(0);
    base.style.transition = 'none'; base.style.opacity = '1'; base.classList.add('tree-sway');
    next.style.opacity = '0';
    stageName.style.opacity = '1';
    paintStatic();
  });

  paintStatic();
})();
