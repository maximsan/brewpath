<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>BrewPath — Prototype</title>
<script>
  // Apply the saved theme (light | dark | system) before first paint so every
  // screens-overview iframe opens in the right appearance with no flash.
  (function(){
    try {
      var pref = localStorage.getItem('cq-theme') || 'dark';
      var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var isDark = pref === 'dark' || (pref === 'system' && sysDark);
      var root = document.documentElement;
      if (isDark) { root.setAttribute('data-mood', 'dark-roast'); }
      else { root.setAttribute('data-mood', 'cupping'); }
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #F4EFE6;
    --surface:   #FBF7EE;
    --surface-2: #EFE8DA;
    --ink:       #1B1614;
    --ink-mute:  #6B5F54;
    --rule:      #D8CFBF;
    --accent:    #B8533A;
    --accent-ink:#FBF7EE;
    --sage:      #5F6E55;
    --warn:      #9A5F1C;
    --berry:     #A8362A;
    --water:     #5C93B8;
    --water-hi:  #A9CFE3;
    /* Scrim — deliberately mood-independent: it sits on media, and the media
       does not invert with the theme. Same value in every mood block. */
    --scrim:     color-mix(in oklab, #1B1614 58%, transparent);
    --scrim-ink: #FBF7EE;
    /* Overlays. --dim-modal is fixed like --scrim: a modal must darken in BOTH moods,
       so it never binds to --ink. --veil / --veil-strong do follow the mood — they are
       the page background pulled over the page, so they must swap with it. */
    --dim-modal:   color-mix(in oklab, #0E0A07 62%, transparent);
    --veil:        color-mix(in oklab, var(--bg) 38%, transparent);
    --veil-strong: color-mix(in oklab, var(--bg) 82%, transparent);
    --r:         14px;
  }
  [data-mood="dark-roast"] {
    --bg:        #1A130E;
    --surface:   #251B14;
    --surface-2: #30231A;
    --ink:       #F3E7D2;
    --ink-mute:  #B59E84;
    --rule:      #44321E;
    --accent:    #E07A4F;
    --accent-ink:#1A130E;
    --sage:      #97A285;
    --warn:      #E6A35C;
    --berry:     #C75450;
    --water:     #7FB4D6;
    --water-hi:  #C2E0EF;
    --scrim:     color-mix(in oklab, #1B1614 58%, transparent);
    --scrim-ink: #FBF7EE;
    --dim-modal: color-mix(in oklab, #0E0A07 62%, transparent);
  }

  /* VOICE — display typeface character */
  [data-voice="specimen"] .ff-display {
    font-family: 'Fraunces', serif;
    font-variation-settings: "opsz" 144, "SOFT" 100;
    font-weight: 500;
    letter-spacing: -0.035em;
  }
  [data-voice="plain-spoken"] .ff-display {
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: #2a2622;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }
  /* Embed mode: when loaded as ?screen=… in an iframe, drop chrome and scale the
     phone to perfectly fit the iframe. */
  body.embed { padding: 0; background: transparent; }
  body.embed .stage > .ff-mono { display: none !important; }
  body.embed .stage { gap: 0; }
  body.embed .phone {
    box-shadow: none;
    transform-origin: top left;
  }
  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  /* Phone */
  .phone {
    width: 393px;
    height: 852px;
    border-radius: 56px;
    background: var(--bg);
    position: relative;
    overflow: hidden;
    box-shadow:
      0 0 0 12px #0a0807,
      0 0 0 13px #2a2622,
      0 50px 100px rgba(0,0,0,0.5),
      0 0 0 14px rgba(255,255,255,0.04);
    font-family: 'IBM Plex Sans', sans-serif;
    color: var(--ink);
  }
  .dynamic-island {
    position: absolute;
    top: 11px;
    left: 50%;
    transform: translateX(-50%);
    width: 124px;
    height: 36px;
    background: #000;
    border-radius: 22px;
    z-index: 100;
  }
  .status-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 54px;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 32px 0;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: var(--t-body);
    font-weight: 500;
    color: var(--ink);
    pointer-events: none;
  }
  .status-bar .time { letter-spacing: -0.2px; }
  .status-bar .icons { display: flex; align-items: center; gap: 6px; }
  .status-bar .icons svg { fill: var(--ink); }

  .screen-area {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }
  .screen.hidden { display: none; }
  .scroll {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    padding-top: 54px;
  }
  .scroll::-webkit-scrollbar { display: none; }

  .home-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 134px;
    height: 5px;
    border-radius: 100px;
    background: var(--ink);
    opacity: 0.85;
    z-index: 90;
    pointer-events: none;
  }

  /* Typography — 3 families, one 9-step ladder. Nothing off-ladder.
     56 hero numeral (mono, celebration only) · 30 screen title · 26 card/section title
     · 19 card & row heading (all three display steps are Fraunces 400)
     · 17 lead · 15 body/controls · 13 support · 11 label · 9.5 micro
     Weights: Fraunces 400 · Plex Sans 400 body / 500 controls · Plex Mono 500. */
  /* Illustration palette — LITERAL coffee, not UI meaning. Identical in both
     moods (a ripe cherry is the same colour under any theme), which is exactly
     why these are not --warn: that token means celebration and nothing else. */
  :root {
    --art-raw:#9FB088; --art-roast-light:#C79A63; --art-roast-mid:#A2703C; --art-roast-deep:#7A4526; --art-roast-dark:#54301C;
    --art-ripe:#C8843A; --art-sour:#B79A3C;
    /* the cherry in section — one ramp, shared by every cross-section drawing */
    --art-cherry-skin:#A93227; --art-cherry-pulp:#C9563A; --art-cherry-gel:#D9A94C;
    --art-cherry-parchment:#E3D2AE; --art-cherry-silverskin:#F1E8D6; --art-cherry-seed:#8FA184;
    --art-seed-crease:#5C6B52;
    /* highlight on illustration fills — was defined in the dark mood only, so every
       art highlight lost its colour in cupping. Literal, so it does not flip. */
    --cream:#F0DCB8;
  }
  :root {
    --t-hero: 56px; --t-display: 30px; --t-title: 26px; --t-heading: 19px;
    --t-lead: 17px; --t-body: 15px; --t-support: 13px; --t-label: 11px; --t-micro: 9.5px;
  }
  .ff-display { font-family: 'Fraunces', serif; font-optical-sizing: auto; }
  .ff-mono    { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }
  .ff-ui      { font-family: 'IBM Plex Sans', sans-serif; }
  .smallcaps {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: var(--t-label);
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-mute);
  }
  .smallcaps-mono {
    font-family: 'IBM Plex Mono', monospace;
    font-size: var(--t-label);
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-mute);
    font-variant-numeric: tabular-nums;
  }

  /* Buttons */
  .btn {
    appearance: none;
    border: none;
    cursor: pointer;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 500;
    font-size: var(--t-body);
    letter-spacing: 0.02em;
    transition: transform 120ms ease, opacity 120ms ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary {
    background: var(--accent);
    color: var(--accent-ink);
    border-radius: var(--r);
    padding: 16px 24px;
    width: 100%;
    text-transform: none;
  }
  .btn-primary:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .btn-ghost {
    background: transparent;
    color: var(--ink);
    padding: 16px 24px;
    border: 1px solid var(--rule);
    border-radius: var(--r);
    width: 100%;
  }
  .btn-ghost:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .btn-link {
    background: transparent;
    color: var(--accent);
    text-decoration: none;
    font-size: var(--t-support);
    padding: 8px;
  }

  /* Form rows (cupping form style) */
  .form-row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: baseline;
    padding: 14px 0;
    border-bottom: 1px solid var(--rule);
    gap: 16px;
  }
  .form-row:last-child { border-bottom: none; }
  .form-row .lbl {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: var(--t-label);
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-mute);
  }
  .form-row .val {
    font-family: 'IBM Plex Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-size: var(--t-support);
    color: var(--ink);
    text-align: right;
    white-space: nowrap;
  }

  /* Cards */
  .card {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: var(--r);
    padding: 24px;
  }

  hr.rule {
    border: none;
    border-top: 1px solid var(--rule);
    margin: 0;
  }

  /* Tab bar */
  .tabbar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--surface);
    border-top: 1px solid var(--rule);
    padding: 8px 0 28px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    z-index: 80;
  }
  .tabbar.hidden { display: none; }
  .tab {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 6px 0;
    cursor: pointer;
    color: var(--ink-mute);
    transition: color 200ms ease;
  }
  .tab.active { color: var(--accent); }
  .tab .label {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: var(--t-micro);
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  /* Lesson nodes */
  .lesson-row {
    position: relative;
    display: grid;
    grid-template-columns: 32px 1fr auto;
    align-items: center;
    gap: 14px;
    padding: 18px 0 18px 0;
    border: none;
    border-bottom: 1px solid var(--rule);
    cursor: pointer;
    width: 100%;
    text-align: left;
    background: transparent;
    font: inherit;
    color: inherit;
    appearance: none;
    -webkit-appearance: none;
    border-radius: 0;
  }
  .lesson-row:last-child { border-bottom: none; }
  .lesson-row:disabled { cursor: not-allowed; }
  .lesson-row.locked { opacity: 0.4; }
  /* Path spine — a vertical line threading the node column, node discs mask it into stops */
  .lesson-row::before {
    content: '';
    position: absolute;
    left: 15.5px;
    top: 0;
    bottom: 0;
    width: 1px;
    background: var(--rule);
    z-index: 0;
  }
  .lesson-row:first-child::before { top: 50%; }
  .lesson-row:last-child::before  { bottom: 50%; }
  .path-node {
    position: relative;
    z-index: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    background: var(--bg);
    border-radius: 50%;
  }
  .trail { display: inline-flex; align-items: center; justify-content: center; width: 24px; flex-shrink: 0; }
  .lesson-row .title {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: var(--t-body);
    font-weight: 500;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .lesson-row .meta {
    font-family: 'IBM Plex Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-size: var(--t-label);
    color: var(--ink-mute);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
    z-index: 1;
  }
  .lesson-row .meta.earned { color: var(--sage); }
  /* Current lesson — the next thing to do */
  .lesson-row.current {
    background: color-mix(in oklab, var(--accent) 7%, transparent);
    border-bottom-color: transparent;
  }
  .lesson-row.current .title { font-weight: 500; }
  .lesson-row.current .path-node { background: color-mix(in oklab, var(--accent) 7%, var(--bg)); }
  .lesson-row .meta.continue {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--accent);
    font-weight: 500;
  }
  .lesson-row .meta.continue svg {
    flex-shrink: 0;
    width: 6px;
    height: 10px;
    display: block;
  }
  /* Coffee Challenge — a side-quest card branching off the path spine */
  .lesson-row.challenge-sub { padding: 8px 0 8px 0; cursor: pointer; }
  /* Compact path (Tweaks): halve the vertical rhythm and drop the row dividers */
  :root[data-path-compact] .lesson-row { padding-top: 11px; padding-bottom: 11px; border-bottom-color: transparent; }
  /* Locked/upcoming lessons stay compact — they're just placeholders */
  :root[data-path-compact] .lesson-row.locked { padding-top: 6px; padding-bottom: 6px; }
  /* A lesson with a challenge branching below it keeps its original tight rhythm */
  :root[data-path-compact] .lesson-row:has(+ .challenge-sub) { padding-top: 6px; padding-bottom: 6px; }
  /* A lesson directly after a challenge keeps the original gap below that challenge */
  :root[data-path-compact] .lesson-row.challenge-sub + .lesson-row { padding-top: 6px; }
  :root[data-path-compact] .lesson-row.challenge-sub { padding-top: 4px; padding-bottom: 4px; }
  :root[data-path-compact] .lesson-row.current { background: transparent; }
  :root[data-path-compact] .lesson-row.current .path-node { background: var(--bg); }
  :root[data-path-compact] .challenge-card { padding: 8px 10px 8px 11px; border: none; background: transparent; }
  .challenge-junction { width: 32px; height: 32px; }
  .challenge-diamond { width: 7px; height: 7px; transform: rotate(45deg); background: var(--accent); border-radius: 1.5px; }
  .cq-completed .challenge-diamond { background: var(--sage); }
  .challenge-card {
    position: relative; grid-column: 2; z-index: 1; margin-left: -12px;
    display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 12px;
    padding: 12px 14px; border-radius: 14px;
    border: 1px dashed color-mix(in oklab, var(--accent) 38%, var(--rule));
    background: color-mix(in oklab, var(--accent) 6%, transparent);
    min-width: 0;
  }
  .challenge-trail { grid-column: 3; justify-self: end; align-self: center; display: inline-flex; align-items: center; position: relative; z-index: 1; padding-right: 14px; }
  /* Unified hover: one highlight behind the card + trailing action, so the whole challenge lights up as a single element */
  .challenge-sub::after {
    content: ''; position: absolute; z-index: 0; pointer-events: none;
    left: 34px; right: 0; top: 8px; bottom: 8px; border-radius: 14px;
    background: transparent; transition: background 120ms;
  }
  .challenge-sub:not(:disabled):hover::after { background: color-mix(in oklab, var(--accent) 9%, transparent); }
  .cq-completed.challenge-sub:not(:disabled):hover::after { background: color-mix(in oklab, var(--ink) 3%, transparent); }
  .challenge-sub:not(:disabled):hover .challenge-card { background: transparent; }
  .challenge-card::before {
    content: ''; position: absolute; left: -11px; width: 10px; top: 50%;
    border-top: 1px dashed color-mix(in oklab, var(--accent) 45%, var(--rule));
  }
  .cq-completed .challenge-card { border-style: solid; border-color: var(--rule); background: transparent; }
  .cq-completed .challenge-card::before { border-top-style: solid; border-top-color: var(--rule); }
  .cq-active .challenge-card { border-style: solid; border-color: color-mix(in oklab, var(--accent) 40%, var(--rule)); }
  .cq-completed.challenge-sub:hover .challenge-card { background: transparent; }
  .challenge-badge {
    width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0;
    border: 1px dashed color-mix(in oklab, var(--accent) 55%, transparent);
    background: color-mix(in oklab, var(--accent) 10%, var(--bg));
  }
  .cq-completed .challenge-badge { border: 1px solid color-mix(in oklab, var(--sage) 50%, transparent); background: color-mix(in oklab, var(--sage) 8%, var(--bg)); }
  .challenge-kicker { font-family: 'IBM Plex Mono', monospace; font-size: var(--t-micro); letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cq-completed .challenge-kicker { color: var(--sage); }
  .challenge-title { font-family: 'IBM Plex Sans', sans-serif; font-size: var(--t-support); font-weight: 500; color: var(--ink); line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .challenge-pill {
    font-family: 'IBM Plex Mono', monospace; font-size: var(--t-micro); font-weight: 500; letter-spacing: 0.08em;
    text-transform: uppercase; padding: 8px 11px; border-radius: 999px; white-space: nowrap;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; align-self: center;
    min-width: 76px; box-sizing: border-box;
  }
  .challenge-pill.start { background: var(--accent); color: var(--bg); }
  .challenge-pill.resume { border: 1px solid color-mix(in oklab, var(--accent) 60%, transparent); color: var(--accent); }
  .challenge-pill.live { color: var(--accent); padding-right: 4px; }
  .challenge-pill.done { color: var(--sage); padding-right: 4px; font-weight: 500; }
  .challenge-pill .pulse-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: cq-pulse 1.6s ease-in-out infinite; }
  @keyframes cq-pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.7); } }

  /* Goal/brewer cards in onboarding */
  .pick-card {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 16px;
    padding: 20px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: var(--r);
    cursor: pointer;
    transition: border-color 150ms ease, background 150ms ease;
  }
  .pick-card.selected {
    border-color: var(--accent);
    background: var(--surface);
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .pick-card .pc-title {
    font-family: 'Fraunces', serif;
    font-size: var(--t-heading);
    font-weight: 400;
    line-height: 1.1;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  .pick-card .pc-desc {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: var(--t-support);
    color: var(--ink-mute);
    margin-top: 4px;
    line-height: 1.4;
  }

  /* MCQ */
  .mcq-choice {
    display: block;
    width: 100%;
    text-align: left;
    padding: 18px 20px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: var(--r);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: var(--t-body);
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
    transition: all 150ms ease;
  }
  .mcq-choice.correct {
    border-color: var(--sage);
    background: color-mix(in oklab, var(--sage) 12%, var(--surface));
    color: var(--ink);
  }
  .mcq-choice.incorrect {
    border-color: var(--berry);
    background: color-mix(in oklab, var(--berry) 8%, var(--surface));
  }
  .mcq-choice:disabled { cursor: default; }
  /* Inset variant — used inside an already-contained card (term page knowledge
     check) so options are hairline-separated rows, not boxes inside a box. */
  .mcq-inset .mcq-choice { background: transparent; border-color: transparent; border-top-color: var(--rule); border-radius: 0; padding: 13px 2px; display: flex; align-items: center; gap: 12px; text-align: left; }
  .mcq-inset .mcq-choice:first-child { border-top-color: transparent; }
  .mcq-inset .mcq-dot { width: 15px; height: 15px; border-radius: 999px; border: 1px solid var(--rule); flex-shrink: 0; transition: all 150ms ease; }
  .mcq-inset .mcq-choice.correct { background: transparent; border-color: transparent; border-top-color: var(--rule); color: var(--sage); }
  .mcq-inset .mcq-choice.incorrect { background: transparent; border-color: transparent; border-top-color: var(--rule); color: var(--berry); }
  .mcq-inset .mcq-choice.correct:first-child, .mcq-inset .mcq-choice.incorrect:first-child { border-top-color: transparent; }
  .mcq-inset .mcq-choice.correct .mcq-dot { border-color: var(--sage); background: var(--sage); }
  .mcq-inset .mcq-choice.incorrect .mcq-dot { border-color: var(--berry); background: var(--berry); }

  /* THE blank — .fill-slot is shared by concept sentences and the predict cloze (see FillSlot in lesson.jsx) */
  /* line-height 1.15, not the paragraph's 1.7: the slot is an inline-block, so its
     bottom border follows its own box — leading would drop the rule off the baseline. */
  .fill-slot { font-family: 'IBM Plex Mono', monospace; color: var(--ink-mute); line-height: 1.15;
    border-bottom: 2px dashed color-mix(in oklab, var(--accent) 55%, var(--rule));
    padding: 0 6px 1px; min-width: 74px; text-align: center; display: inline-block;
    transition: color 200ms ease, border-color 200ms ease; }
  .fill-slot.filled { color: var(--ink); border-bottom-color: color-mix(in oklab, var(--accent) 70%, var(--rule)); border-bottom-style: solid; }
  .fill-slot.filled.right { color: var(--sage); border-bottom-color: var(--sage); }
  .fill-slot.filled.wrong { color: var(--berry); border-bottom-color: var(--berry); }
  /* ungraded guess (predict card): accent, because it is the learner's claim, not a verdict */
  .fill-slot.filled.guess { color: var(--accent); border-bottom-color: var(--accent); }
  /* inside display type the slot keeps the sentence's face instead of switching to mono */
  .fill-slot.inherit { font-family: inherit; }
  .fill-groups { display: flex; flex-direction: column; gap: 18px; margin-top: 28px; }
  .fill-rl { font-size: var(--t-label); font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-mute); margin-bottom: 8px; }
  .fill-opts { display: flex; gap: 10px; }
  .fill-opts .mcq-choice { flex: 1; text-align: center; padding: 14px 12px; }
  .fill-opts .mcq-choice.picked { border-color: var(--accent); background: color-mix(in oklab, var(--accent) 10%, var(--surface)); color: var(--ink); }
  .fill-group.solved .mcq-choice:not(.correct):not(.incorrect) { opacity: 0.4; }

  /* Predict — two-up tiles for the opening guess. Never graded, so the chosen
     tile reads as "sealed" (accent) rather than right or wrong. */
  .pick-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; margin-top: 18px; }
  .pick-tile { appearance: none; cursor: pointer; display: grid; place-items: center;
    padding: 26px 14px; border-radius: 14px; border: 1px solid var(--rule);
    background: var(--surface); color: var(--ink); font-size: var(--t-body); transition: all 160ms ease; }
  .pick-tile-t { font-family: 'Fraunces', serif; font-optical-sizing: auto; font-size: var(--t-heading); letter-spacing: -0.01em; }
  .pick-tile.chosen { border-color: var(--accent); background: color-mix(in oklab, var(--accent) 12%, var(--surface)); }
  .pick-tile.faded { opacity: 0.62; }
  .pick-tile:disabled { cursor: default; }

  /* Decision — bag-like options with a name and a spec line. */
  .bag-opt { appearance: none; cursor: pointer; width: 100%; text-align: left;
    display: flex; flex-direction: column; gap: 5px; padding: 15px 16px;
    border-radius: 13px; border: 1px solid var(--rule); background: var(--surface);
    color: var(--ink); transition: all 160ms ease; }
  .bag-opt-t { font-size: var(--t-body); font-weight: 500; line-height: 1.3; }
  .bag-opt-s { font-size: var(--t-label); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-mute); }
  .bag-opt.correct { border-color: var(--sage); background: color-mix(in oklab, var(--sage) 12%, var(--surface)); }
  .bag-opt.incorrect { border-color: var(--berry); background: color-mix(in oklab, var(--berry) 8%, var(--surface)); }
  .bag-opt.faded { opacity: 0.45; }
  .bag-opt:disabled { cursor: default; }

  /* Multiple select — pick all that apply, checked together on submit */
  .ms-choice {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    text-align: left;
    padding: 16px 18px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: var(--r);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: var(--t-body);
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
    transition: border-color 150ms ease, box-shadow 150ms ease, background 150ms ease;
  }
  .ms-box {
    width: 22px; height: 22px;
    flex-shrink: 0;
    border: 1.5px solid var(--ink-mute);
    border-radius: 2px;
    display: grid;
    place-items: center;
    color: transparent;
    transition: background 150ms ease, border-color 150ms ease, color 150ms ease;
  }
  .ms-choice.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .ms-choice.on .ms-box { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .ms-choice.correct { border-color: var(--sage); background: color-mix(in oklab, var(--sage) 12%, var(--surface)); }
  .ms-choice.correct .ms-box { background: var(--sage); border-color: var(--sage); color: var(--surface); }
  .ms-choice.incorrect { border-color: var(--berry); background: color-mix(in oklab, var(--berry) 8%, var(--surface)); }
  .ms-choice.incorrect .ms-box { background: var(--berry); border-color: var(--berry); color: var(--surface); }
  .ms-choice.missed { border-color: var(--sage); border-style: dashed; }
  .ms-choice.missed .ms-box { border-color: var(--sage); border-style: dashed; color: var(--sage); background: transparent; }
  .ms-choice:disabled { cursor: default; }
  .ms-tag {
    margin-left: auto;
    font-family: 'IBM Plex Mono', monospace;
    font-size: var(--t-micro);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--sage);
    white-space: nowrap;
  }

  /* Cards collection grid */
  .cards-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .collect-card {
    aspect-ratio: 3/4;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: var(--r);
    padding: 14px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .collect-card.locked {
    opacity: 0.32;
    cursor: not-allowed;
  }
  .collect-card .cc-title {
    font-family: 'Fraunces', serif;
    font-size: var(--t-lead);
    font-weight: 400;
    line-height: 1.15;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  .collect-card .cc-sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: var(--t-micro);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-mute);
  }

  /* Sheet */
  .sheet-backdrop {
    position: absolute;
    inset: 0;
    background: var(--dim-modal);
    -webkit-backdrop-filter: blur(5px);
    backdrop-filter: blur(5px);
    z-index: 95;
    opacity: 0;
    pointer-events: none;
    transition: opacity 250ms ease;
  }
  .sheet-backdrop.open {
    opacity: 1;
    pointer-events: auto;
  }
  .sheet {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    max-height: 78%;
    background: var(--bg);
    border-top-left-radius: 16px;
    border-top-right-radius: 16px;
    border-top: 1px solid var(--rule);
    transform: translateY(100%);
    transition: transform 280ms cubic-bezier(0.2, 0.8, 0.2, 1);
    z-index: 96;
    display: flex;
    flex-direction: column;
    box-shadow: 0 -20px 40px rgba(0,0,0,0.18);
  }
  .sheet.open { transform: translateY(0); }
  .sheet-handle {
    width: 36px;
    height: 4px;
    border-radius: var(--r);
    background: var(--rule);
    margin: 8px auto 0;
  }
  .sheet-content {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px 32px;
  }
  .sheet-content::-webkit-scrollbar { display: none; }

  /* Lesson player progress */
  .lesson-topbar {
    position: absolute;
    top: 54px;
    left: 0;
    right: 0;
    padding: 12px 20px;
    display: grid;
    grid-template-columns: 32px 1fr 32px;
    align-items: center;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--rule);
  }
  .close-btn {
    appearance: none;
    background: transparent;
    border: none;
    cursor: pointer;
    color: var(--ink);
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  /* 44px hit area without a 44px box: the glyph stays where it was aligned. */
  .close-btn::before {
    content: ''; position: absolute; top: 50%; left: 50%;
    width: 44px; height: 44px; transform: translate(-50%, -50%);
  }

  /* Slider */
  .slider-track {
    position: relative;
    height: 2px;
    background: var(--rule);
    margin: 36px 0 12px;
  }
  input[type="range"].brew-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    background: transparent;
    margin: 0;
    height: 32px;
    cursor: pointer;
    position: relative;
    z-index: 2;
  }
  input[type="range"].brew-slider:focus {
    outline: none;
  }
  input[type="range"].brew-slider::-webkit-slider-runnable-track {
    height: 3px;
    border-radius: 999px;
    background: linear-gradient(to right, var(--accent) var(--fill, 50%), var(--rule) var(--fill, 50%));
  }
  input[type="range"].brew-slider::-moz-range-track {
    height: 3px;
    border-radius: 999px;
    background: var(--rule);
  }
  input[type="range"].brew-slider::-moz-range-progress {
    height: 3px;
    border-radius: 999px;
    background: var(--accent);
  }
  input[type="range"].brew-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 28px;
    height: 28px;
    border-radius: 999px;
    background: var(--accent);
    border: 2px solid var(--bg);
    margin-top: -13px;
    box-shadow: 0 0 0 1px var(--accent);
  }
  input[type="range"].brew-slider:focus::-webkit-slider-thumb {
    outline: none;
  }

  /* Help button + how-to-play drawer */
  .help-btn {
    appearance: none;
    width: 32px; height: 32px;
    border-radius: 999px;
    border: 1px solid var(--rule);
    background: transparent;
    color: var(--ink-mute);
    font-family: 'IBM Plex Mono', monospace;
    font-size: var(--t-body);
    line-height: 1;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: color .15s ease, border-color .15s ease;
  }
  .help-btn:hover { color: var(--ink); border-color: var(--ink-mute); }
  .help-scrim {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.32);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
    z-index: 60;
  }
  .help-scrim.open { opacity: 1; pointer-events: auto; }
  .help-sheet {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    background: var(--bg);
    border-radius: 16px 16px 0 0;
    padding: 14px 24px 30px;
    transform: translateY(105%);
    transition: transform .32s cubic-bezier(.4,0,.2,1);
    z-index: 61;
    box-shadow: 0 -10px 34px rgba(0,0,0,0.14);
  }
  .help-sheet.open { transform: translateY(0); }
  .help-grip {
    width: 36px; height: 4px;
    border-radius: 999px;
    background: var(--rule);
    margin: 0 auto 18px;
  }
  input[type="range"].brew-slider::-moz-range-thumb {
    width: 24px; height: 24px;
    border-radius: 999px;
    background: var(--accent);
    border: 2px solid var(--bg);
  }

  /* Slider card — target-zone overlay over the drag surface */
  .slider-track-wrap {
    position: relative;
  }
  .slider-zone {
    position: absolute;
    top: 50%;
    height: 10px;
    transform: translateY(-50%);
    background: color-mix(in oklab, var(--sage) 30%, transparent);
    border-radius: 999px;
    z-index: 1;
    pointer-events: none;
  }

  /* Match game */
  .match-wrap { position: relative; }
  .match-lines {
    position: absolute; inset: 0;
    pointer-events: none;
    z-index: 3;
    overflow: visible;
  }
  .match-col {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .match-col.right { justify-content: space-around; }
  .match-item {
    position: relative;
    padding: 15px 18px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: var(--r);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: var(--t-support);
    cursor: pointer;
    color: var(--ink);
    transition: border-color 150ms ease, box-shadow 150ms ease, background 150ms ease, transform 150ms ease;
    touch-action: none;
    user-select: none;
  }
  .match-item.selected {
    border-color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .match-item.drop-hot {
    border-color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent);
    transform: scale(1.03);
  }
  .match-item.matched {
    border-color: var(--sage);
    background: color-mix(in oklab, var(--sage) 12%, var(--surface));
    color: var(--ink);
    cursor: default;
  }
  .match-item.linked {
    border-color: var(--sage);
  }
  @keyframes matchWrongShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-5px); }
    40% { transform: translateX(5px); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(3px); }
  }
  .match-item.wrong {
    border-color: var(--berry);
    background: color-mix(in oklab, var(--berry) 8%, var(--surface));
    animation: matchWrongShake 400ms ease;
  }
  @keyframes matchSnap {
    0% { transform: scale(1); }
    45% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }
  .match-item.snap { animation: matchSnap 320ms cubic-bezier(.3,1.3,.5,1); }
  /* source tile while its clone is being dragged: left in place as a dashed slot */
  .match-item.dragging {
    opacity: 0.4;
    border-style: dashed;
    background: var(--bg);
  }
  /* floating clone that follows the pointer during a drag */
  .match-ghost {
    position: absolute;
    z-index: 20;
    pointer-events: none;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    padding: 15px 18px;
    background: var(--surface);
    border: 1px solid var(--accent);
    border-radius: var(--r);
    box-shadow: inset 0 0 0 1px var(--accent), 0 10px 24px -8px rgba(0,0,0,0.35);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: var(--t-support);
    color: var(--ink);
    transform: rotate(-1.5deg);
  }
  /* Sequence */
  .seq-item {
    display: grid;
    grid-template-columns: 32px 1fr;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: var(--r);
    margin-bottom: 8px;
    cursor: pointer;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: var(--t-support);
    color: var(--ink);
  }
  .seq-item .num {
    font-family: 'IBM Plex Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-size: var(--t-label);
    color: var(--ink-mute);
    width: 24px;
    height: 24px;
    border-radius: 999px;
    border: 1px solid var(--rule);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .seq-item.assigned .num {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }
  .seq-item.correct {
    border-color: var(--sage);
    background: color-mix(in oklab, var(--sage) 10%, var(--surface));
  }
  .seq-item.correct .num {
    background: var(--sage);
    color: var(--surface);
    border-color: var(--sage);
  }
  .seq-item.wrong {
    border-color: var(--berry);
    background: color-mix(in oklab, var(--berry) 8%, var(--surface));
  }
  .seq-item.wrong .num {
    background: var(--berry);
    color: var(--surface);
    border-color: var(--berry);
  }
  .seq-hint {
    font-family: 'IBM Plex Mono', monospace;
    font-size: var(--t-micro);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-mute);
    white-space: nowrap;
  }

  /* Completion stamp animation */
  @keyframes stampIn {
    0%   { transform: scale(1.4) rotate(-3deg); opacity: 0; }
    50%  { opacity: 1; }
    100% { transform: scale(1.0) rotate(0deg);  opacity: 1; }
  }
.stamp {
    animation: stampIn 400ms cubic-bezier(0.2, 1.2, 0.4, 1.0) both;
  }
  /* Challenge-complete celebration: card pop, ink burst, points chip */
  .brew-cheer { animation: cheerPop 520ms cubic-bezier(0.2, 1.4, 0.4, 1) both; }
  @keyframes cheerPop { 0% { transform: scale(0.88); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .cheer-burst { position: absolute; inset: 0; pointer-events: none; }
  .cheer-burst span {
    position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); opacity: 0;
    animation: cheerFly 950ms cubic-bezier(0.1, 0.6, 0.3, 1) 220ms forwards;
  }
  .cheer-burst span:nth-child(3n) { background: var(--sage); }
  .cheer-burst span:nth-child(4n) { width: 4px; height: 8px; border-radius: 2px; background: color-mix(in oklab, var(--ink) 55%, var(--accent)); }
  @keyframes cheerFly {
    0% { transform: translate(-50%, -50%) scale(0.4) rotate(0deg); opacity: 0; }
    12% { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1) rotate(var(--rot, 90deg)); opacity: 0; }
  }
  .cheer-points {
    font-family: 'IBM Plex Mono', monospace; font-size: var(--t-label); font-weight: 500; letter-spacing: 0.1em;
    color: var(--sage); border: 1px solid color-mix(in oklab, var(--sage) 45%, transparent);
    background: color-mix(in oklab, var(--sage) 10%, transparent);
    border-radius: 999px; padding: 3px 9px; display: inline-block;
    animation: cheerPoints 460ms cubic-bezier(0.2, 1.5, 0.4, 1) 420ms both;
  }
  @keyframes cheerPoints { 0% { transform: scale(0.3) translateY(6px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }

  /* fade-up entry for cards */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* Row spinner — a settings row waiting on a network call (restore purchases). */
  @keyframes rowSpin { to { transform: rotate(360deg); } }
  .row-spin { animation: rowSpin 700ms linear infinite; transform-origin: 50% 50%; }
  /* Intro caps mark — the tap-to-continue cue and the BREWPATH signature. They share
     one slot on the loading screen, so they share one treatment: mono, widest tracking. */
  .tap-cue { font-family: 'IBM Plex Mono', monospace; font-size: var(--t-label); font-weight: 400; letter-spacing: 0.24em; text-transform: uppercase; color: var(--ink-mute); text-align: center; }
  .fade-up { animation: fadeUp 260ms ease-out both; }

  /* slide-in tab transitions — no animation, content shows immediately. */
  .slide-in { /* no-op */ }

  /* utility */
  .px-24 { padding-left: 24px; padding-right: 24px; }
  .gap-12 { gap: 12px; }
  .stack { display: flex; flex-direction: column; }
</style>

<script>
  // Embed mode: scale the phone to fit the iframe viewport exactly.
  (function(){
    var qs = new URLSearchParams(location.search);
    if (!qs.get('screen')) return;
    document.documentElement.classList.add('embed-html');
    function applyEmbed(){
      document.body.classList.add('embed');
      var phone = document.querySelector('.phone');
      if (!phone) return;
      var pw = phone.offsetWidth, ph = phone.offsetHeight;
      var s = Math.min(window.innerWidth / pw, window.innerHeight / ph);
      phone.style.transform = 'scale(' + s + ')';
      // center the scaled phone
      var sw = pw * s, sh = ph * s;
      phone.style.position = 'absolute';
      phone.style.left = ((window.innerWidth - sw) / 2) + 'px';
      phone.style.top  = ((window.innerHeight - sh) / 2) + 'px';
    }
    window.addEventListener('load', function(){ setTimeout(applyEmbed, 50); });
    window.addEventListener('resize', applyEmbed);
  })();
</script>
