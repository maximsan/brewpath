# The macOS half of CI. GitHub bills macOS runners at ten times Linux and
# rounds every job up, so on a private repo these two workflows cost 150
# charged minutes per push to main — more than the whole Linux suite by an
# order of magnitude. Codemagic bills real minutes against a 500-a-month
# personal allowance, which the schedule below is sized to fit.
#
# The Linux checks stay in .github/workflows/ci.yml, where they bill at 1x.

definitions:
  environment: &macos
    flutter: 3.44.1
    xcode: latest
  cache: &pub
    cache_paths:
      - $HOME/.pub-cache

workflows:
  ios-build:
    name: iOS build
    # M2 is the cheapest instance the free allowance covers.
    instance_type: mac_mini_m2
    # A backstop against a wedged runner, not a bound on the build: this
    # takes about four minutes.
    max_build_duration: 30
    environment: *macos
    cache: *pub
    # Pushes to main only. On a pull request the same commit is built again
    # on merge, which proved the same thing twice; a branch that warrants an
    # iOS check before merging gets a manual build from the Codemagic UI.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: flutter pub get

      # No CocoaPods (project migrated to Swift Package Manager) and no
      # GoogleService-Info.plist needed — the build succeeds with Firebase
      # gated off (kUseFirebase == false).
      - name: Build iOS (no code signing)
        script: flutter build ios --release --no-codesign

      - name: Verify build artifact
        script: ls -la build/ios/iphoneos/Runner.app

      # The privacy manifest is wired into the Runner target by hand in
      # project.pbxproj (#166). Nothing else notices if that entry is dropped
      # in a merge — the app still builds and still boots, and the rejection
      # only arrives from App Store Connect. So assert the file actually lands
      # in the bundle, and still declares the SQLite file-timestamp reason.
      - name: Verify privacy manifest is in the bundle
        script: |
          MANIFEST=build/ios/iphoneos/Runner.app/PrivacyInfo.xcprivacy
          test -f "$MANIFEST" || {
            echo "$MANIFEST is missing — the Runner target lost it from Copy Bundle Resources."
            exit 1
          }
          plutil -lint "$MANIFEST"
          plutil -extract NSPrivacyAccessedAPITypes.0.NSPrivacyAccessedAPIType raw "$MANIFEST" \
            | grep -qx NSPrivacyAccessedAPICategoryFileTimestamp || {
            echo "The file-timestamp reason is gone; SQLite still needs it."
            exit 1
          }

      # Same hazard as the manifest above, and the same shape of fix: the
      # associated-domains entitlement is wired into the Runner target by hand
      # (#171), the app builds and boots without it, and the only symptom is
      # that every shared link opens Safari instead. This build is
      # --no-codesign, so the entitlement never reaches the bundle — assert the
      # wiring in the project file instead, which is the part a merge drops.
      - name: Verify the associated-domains entitlement is still wired
        script: |
          ENTITLEMENTS=ios/Runner/Runner.entitlements
          plutil -lint "$ENTITLEMENTS"
          # PlistBuddy, not `plutil -extract`: plutil reads dots in a key path
          # as separators, and this key name is all dots.
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.associated-domains:0' \
            "$ENTITLEMENTS" | grep -qx 'applinks:brewpath.maximsan.dev' || {
            echo "$ENTITLEMENTS no longer claims brewpath.maximsan.dev."
            exit 1
          }
          test "$(grep -c 'CODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements;' \
            ios/Runner.xcodeproj/project.pbxproj)" = 3 || {
            echo "Expected all three Runner configs to name the entitlements file."
            exit 1
          }

  smoke:
    name: smoke (simulator)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment: *macos
    cache: *pub
    # No `triggering` block, so nothing in the repository starts this. It runs
    # on a nightly schedule, which is configured in the Codemagic UI under
    # Build scheduling — the schedule cannot be expressed in this file.
    #
    # Nightly rather than per-push because of what the job is for: it guards
    # against *rot* rather than against a specific regression, and rot is a
    # thing you check on a clock. It is also the expensive half of the macOS
    # budget, so this is what keeps the month inside the free allowance.
    #
    # It is the only job that runs the app rather than compiling it.
    # Everything under `flutter test` uses in-memory Drift, a cleared asset
    # bundle and a seeded onboarding flag, so a migration that fails on a real
    # database, an asset the pubspec does not bundle, and an unregistered
    # plugin are all invisible to it. `iOS build` proves the app links, never
    # that it boots.
    #
    # This job exists because the suite spent months failing while every PR
    # stayed green: nothing ran it, so nobody knew (#187).
    scripts:
      - name: Install dependencies
        script: flutter pub get

      # Whichever iPhone the image ships — pinning a model would break every
      # time the image rolls forward. tool/ci/boot_simulator.sh erases it,
      # boots it, and waits until it can take an app launch; a preinstalled
      # device can spend minutes migrating its data on first boot, and an app
      # launched before that is refused.
      - name: Boot an iPhone simulator
        script: |
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          runtimes = json.load(sys.stdin)['devices']
          for runtime, devices in runtimes.items():
              if 'iOS' not in runtime:
                  continue
              for device in devices:
                  if device.get('isAvailable') and device['name'].startswith('iPhone'):
                      print(device['udid'])
                      sys.exit(0)
          sys.exit('no available iPhone simulator on this runner')
          ")
          echo "Booting $UDID"
          tool/ci/boot_simulator.sh "$UDID"
          # $CM_ENV is how a value reaches the next script; each one is its
          # own shell.
          echo "SIMULATOR_UDID=$UDID" >> "$CM_ENV"

      # Build the app with the smoke test as its entry point. `flutter build`
      # rather than `xcodebuild` alone, because the Flutter tool is what raises
      # the generated plugin package's platform floor to the project's 16.0;
      # left at the package's default 13.0, the Firebase packages refuse to
      # build (the "minimum platform version" error tool/reset_ios_spm.sh
      # exists for).
      - name: Build the smoke test app
        script: flutter build ios --simulator --debug -t integration_test/smoke_test.dart

      # Xcode launches the app and reports every Dart test as an XCTest result
      # (ios/RunnerTests/RunnerTests.m). Not `flutter test integration_test`:
      # that launches the app itself and then waits for "The Dart VM service
      # is listening on" to arrive on a `log stream` it starts *after* the
      # launch. A live stream shows nothing from before it attached, so when
      # the app prints first the tool waits forever.
      - name: Smoke test
        script: |
          set -o pipefail
          # No parallel testing: with it on, Xcode clones the simulator and
          # runs on the clone, which has to boot all over again — the wait
          # the boot step above already paid for.
          xcodebuild test \
            -workspace ios/Runner.xcworkspace -scheme Runner -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -parallel-testing-enabled NO \
            -derivedDataPath build/ios_integ \
            -resultBundlePath smoke.xcresult \
            2>&1 | tee smoke-xcodebuild.log \
            | grep -E 'Test Case|Test Suite|Executed|error:|\*\* TEST'
    # The full log and Xcode's result bundle outlive the build whatever ends
    # it, so a failure can be read afterwards instead of reconstructed from
    # silence.
    artifacts:
      - smoke-xcodebuild.log
      - smoke.xcresult
