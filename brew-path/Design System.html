<!doctype html>
<html lang="en" data-mood="dark-roast">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>BrewPath — Design System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ── Theme tokens (mirrors index.html) ───────────────────────── */
  :root {
    --bg:#F4EFE6; --surface:#FBF7EE; --surface-2:#EFE8DA;
    --ink:#1B1614; --ink-mute:#6B5F54; --rule:#D8CFBF;
    --accent:#B8533A; --accent-ink:#FBF7EE;
    --sage:#5F6E55; --warn:#9A5F1C; --berry:#A8362A;
    --water:#5C93B8; --water-hi:#A9CFE3;
    --scrim:color-mix(in oklab, #1B1614 58%, transparent); --scrim-ink:#FBF7EE;
    --dim-modal:color-mix(in oklab, #0E0A07 62%, transparent);
    --veil:color-mix(in oklab, var(--bg) 38%, transparent);
    --veil-strong:color-mix(in oklab, var(--bg) 82%, transparent);
  }
  /* Illustration palette — literal coffee. Mirrors index.html exactly, and sits
     in :root ALONE on purpose: these do not flip with the mood, which is what
     lets --warn mean celebration and nothing else. */
  :root {
    --art-raw:#9FB088; --art-roast-light:#C79A63; --art-roast-mid:#A2703C; --art-roast-deep:#7A4526; --art-roast-dark:#54301C;
    --art-ripe:#C8843A; --art-sour:#B79A3C;
    --art-cherry-skin:#A93227; --art-cherry-pulp:#C9563A; --art-cherry-gel:#D9A94C;
    --art-cherry-parchment:#E3D2AE; --art-cherry-silverskin:#F1E8D6; --art-cherry-seed:#8FA184;
    --art-seed-crease:#5C6B52;
    --cream:#F0DCB8;
  }
  [data-mood="dark-roast"] {
    --bg:#1A130E; --surface:#251B14; --surface-2:#30231A;
    --ink:#F3E7D2; --ink-mute:#B59E84; --rule:#44321E;
    --accent:#E07A4F; --accent-ink:#1A130E;
    --sage:#97A285; --warn:#E6A35C; --berry:#C75450;
    --water:#7FB4D6; --water-hi:#C2E0EF;
    --scrim:color-mix(in oklab, #1B1614 58%, transparent); --scrim-ink:#FBF7EE;
    --dim-modal:color-mix(in oklab, #0E0A07 62%, transparent);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background 300ms ease, color 300ms ease;
  }

  .ff-display { font-family: 'Fraunces', serif; font-optical-sizing: auto; }
  .mono { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }

  /* ── App component CSS (copied from index.html so demos render true) ── */
  .btn { appearance:none; border:none; cursor:pointer; font-family:'IBM Plex Sans',sans-serif; font-weight:500; font-size:15px; letter-spacing:0.02em; transition:transform 120ms ease, opacity 120ms ease; }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background:var(--accent); color:var(--accent-ink); border-radius:2px; padding:16px 24px; width:100%; }
  .btn-primary:disabled { opacity:0.35; cursor:not-allowed; }
  .btn-ghost { background:transparent; color:var(--ink); padding:16px 24px; border:1px solid var(--rule); border-radius:2px; width:100%; }
  .btn-link { background:transparent; color:var(--accent); font-size:13px; padding:8px; }
  .card { background:var(--surface); border:1px solid var(--rule); border-radius:2px; padding:24px; }
  .form-row { display:grid; grid-template-columns:1fr auto; align-items:baseline; padding:14px 0; border-bottom:1px solid var(--rule); gap:16px; }
  .form-row:last-child { border-bottom:none; }
  .form-row .lbl { font-size:11px; font-weight:500; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-mute); }
  .form-row .val { font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; font-size:13px; color:var(--ink); text-align:right; white-space:nowrap; }
  .pick-card { display:grid; grid-template-columns:1fr auto; align-items:center; gap:16px; padding:20px; background:var(--surface); border:1px solid var(--rule); border-radius:2px; }
  .pick-card.selected { border-color:var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .pick-card .pc-title { font-family:'Fraunces',serif; font-size:19px; font-weight:400; line-height:1.1; color:var(--ink); letter-spacing:-0.01em; }
  .pick-card .pc-desc { font-size:13px; color:var(--ink-mute); margin-top:4px; line-height:1.4; }
  .pick-tile { appearance:none; cursor:pointer; display:grid; place-items:center; padding:26px 14px; border-radius:14px; border:1px solid var(--rule); background:var(--surface); color:var(--ink); }
  .pick-tile .pick-tile-t { font-family:'Fraunces',serif; font-optical-sizing:auto; font-size:19px; letter-spacing:-0.01em; }
  .pick-tile.chosen { border-color:var(--accent); background:color-mix(in oklab, var(--accent) 12%, var(--surface)); }
  .pick-tile.faded { opacity:0.62; }
  .mcq-choice { display:block; width:100%; text-align:left; padding:18px 20px; background:var(--surface); border:1px solid var(--rule); border-radius:2px; font-size:15px; font-weight:500; color:var(--ink); }
  .mcq-choice.correct { border-color:var(--sage); background:color-mix(in oklab, var(--sage) 12%, var(--surface)); }
  .mcq-choice.incorrect { border-color:var(--berry); background:color-mix(in oklab, var(--berry) 8%, var(--surface)); }
  .fill-slot { font-family:'IBM Plex Mono',monospace; color:var(--ink-mute); border-bottom:2px dashed color-mix(in oklab, var(--accent) 55%, var(--rule)); padding:0 6px 1px; min-width:74px; text-align:center; display:inline-block; }
  .fill-slot.filled { color:var(--ink); border-bottom-color:color-mix(in oklab, var(--accent) 70%, var(--rule)); border-bottom-style:solid; }
  .fill-slot.filled.right { color:var(--sage); border-bottom-color:var(--sage); }
  .fill-slot.filled.wrong { color:var(--berry); border-bottom-color:var(--berry); }
  .fill-slot.filled.guess { color:var(--accent); border-bottom-color:var(--accent); }
  .fill-slot.inherit { font-family:inherit; }
  .lesson-row { display:grid; grid-template-columns:32px 1fr auto; align-items:center; gap:14px; padding:16px 0; border-bottom:1px solid var(--rule); }
  .lesson-row:last-child { border-bottom:none; }
  .lesson-row.locked { opacity:0.4; }
  .lesson-row .title { font-size:15px; font-weight:500; color:var(--ink); }
  .lesson-row .meta { font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; font-size:11px; color:var(--ink-mute); letter-spacing:0.08em; text-transform:uppercase; white-space:nowrap; }
  .collect-card { aspect-ratio:3/4; background:var(--surface); border:1px solid var(--rule); border-radius:2px; padding:14px; display:flex; flex-direction:column; justify-content:space-between; }
  .collect-card.locked { opacity:0.32; }
  .collect-card .cc-title { font-family:'Fraunces',serif; font-size:19px; font-weight:400; line-height:1.1; color:var(--ink); letter-spacing:-0.01em; }
  .collect-card .cc-sub { font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:0.16em; text-transform:uppercase; color:var(--ink-mute); }
  .match-item { padding:14px 16px; background:var(--surface); border:1px solid var(--rule); border-radius:2px; font-size:13px; color:var(--ink); }
  .match-item.selected { border-color:var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .match-item.matched { border-color:var(--sage); background:color-mix(in oklab, var(--sage) 10%, var(--surface)); color:var(--ink-mute); }
  input[type="range"].brew-slider { -webkit-appearance:none; appearance:none; width:100%; background:transparent; margin:12px 0 0; height:32px; }
  input[type="range"].brew-slider::-webkit-slider-runnable-track { height:1px; background:var(--rule); }
  input[type="range"].brew-slider::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:28px; height:28px; border-radius:999px; background:var(--accent); border:2px solid var(--bg); margin-top:-14px; box-shadow:0 0 0 1px var(--accent); }
  .tab .label { font-size:9.5px; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; }

  /* ── Documentation layout ────────────────────────────────────── */
  .topbar { position:sticky; top:0; z-index:50; display:flex; align-items:center; justify-content:space-between;
    padding:18px 40px; background:color-mix(in oklab, var(--bg) 88%, transparent); backdrop-filter:blur(12px);
    border-bottom:1px solid var(--rule); }
  .brand { display:flex; align-items:baseline; gap:14px; }
  .brand .mark { font-family:'Fraunces',serif; font-size:19px; letter-spacing:-0.01em; }
  .brand .tag { font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:var(--ink-mute); }
  .theme-toggle { display:flex; gap:4px; background:var(--surface); border:1px solid var(--rule); border-radius:999px; padding:4px; }
  .theme-toggle button { appearance:none; border:none; background:transparent; cursor:pointer; font-family:'IBM Plex Mono',monospace;
    font-size:9.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-mute); padding:7px 14px; border-radius:999px; white-space:nowrap; }
  .theme-toggle button.active { background:var(--accent); color:var(--accent-ink); }

  .shell { display:grid; grid-template-columns:200px 1fr; gap:0; max-width:1320px; margin:0 auto; }
  #ds-nav { position:sticky; top:74px; align-self:start; height:max-content; display:flex; flex-direction:column; gap:2px;
    padding:48px 0 0 40px; }
  #ds-nav a { font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--ink-mute); text-decoration:none; padding:8px 12px; border-left:1px solid var(--rule); transition:all 160ms ease; }
  #ds-nav a:hover { color:var(--ink); }
  #ds-nav a.active { color:var(--accent); border-left-color:var(--accent); }

  #ds-main { padding:48px 56px 120px; min-width:0; }

  .hero { padding:8px 56px 8px; max-width:1320px; margin:0 auto; }
  .hero-inner { padding:36px 0 4px; max-width:680px; }
  .hero .mono { font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:var(--accent); }
  .hero h1 { font-family:'Fraunces',serif; font-weight:400; font-size:48px; line-height:1.04; letter-spacing:-0.025em; margin:14px 0 0; }
  .hero p { color:var(--ink-mute); font-size:16px; line-height:1.6; margin:16px 0 0; text-wrap:pretty; }

  .ds-section { padding:60px 0 0; scroll-margin-top:84px; }
  .sec-head { max-width:680px; margin-bottom:30px; }
  .sec-head .eyebrow { font-size:11px; letter-spacing:0.18em; text-transform:uppercase; }
  .eyebrow.acc { color:var(--accent); }
  .eyebrow.dim { color:var(--ink-mute); }
  .sec-head h2 { font-weight:400; font-size:34px; letter-spacing:-0.02em; margin:8px 0 0; }
  .sec-intro { color:var(--ink-mute); font-size:15px; line-height:1.6; margin:12px 0 0; text-wrap:pretty; }

  .stack-cards { display:flex; flex-direction:column; gap:18px; }
  .panel { background:var(--surface); border:1px solid var(--rule); border-radius:2px; padding:24px; }
  .panel-head { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px; }
  .eyebrow { font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color:var(--ink-mute); }

  /* colour */
  .swatch-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
  .swatch { display:grid; grid-template-columns:56px 1fr; gap:16px; background:var(--surface); border:1px solid var(--rule); border-radius:2px; padding:16px; align-items:start; }
  .swatch-chip { width:56px; height:56px; border-radius:2px; border:1px solid var(--rule); }
  .token { font-size:12px; color:var(--accent); }
  .swatch-role { font-weight:600; font-size:14px; margin-top:5px; }
  .swatch-usage { font-size:12.5px; color:var(--ink-mute); line-height:1.5; margin-top:4px; }
  .swatch-hex { display:flex; gap:14px; margin-top:8px; }
  .swatch-hex span { font-size:9.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-mute); }

  /* type */
  .type-sample { line-height:1.1; margin:6px 0 18px; color:var(--ink); }
  .type-italic { font-style:italic; }
  .kv { display:flex; flex-direction:column; gap:10px; border-top:1px solid var(--rule); padding-top:14px; }
  .kv > div { display:grid; grid-template-columns:84px 1fr; gap:14px; align-items:start; }
  .klabel { font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-mute); padding-top:1px; }
  .klabel.acc { color:var(--accent); }
  .kval { font-size:13.5px; line-height:1.55; color:var(--ink); }
  .scale { display:flex; flex-direction:column; gap:2px; }
  .scale-row { display:flex; align-items:baseline; gap:16px; padding:8px 0; border-bottom:1px solid var(--rule); }
  .scale-row:last-child { border-bottom:none; }
  .scale-row span:first-child { color:var(--ink); width:120px; }

  /* shape */
  .shape-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; }
  .shape-card { background:var(--surface); border:1px solid var(--rule); border-radius:2px; padding:20px; }
  .shape-demo { width:100%; height:64px; background:color-mix(in oklab, var(--accent) 16%, var(--surface)); border:1px solid var(--accent); margin-bottom:14px; }
  .rules { margin:10px 0 0; padding-left:18px; }
  .rules li { font-size:13.5px; line-height:1.6; color:var(--ink-mute); margin-bottom:8px; }
  .rules b { color:var(--ink); font-weight:600; }

  /* icons */
  .icon-group { background:var(--surface); border:1px solid var(--rule); border-radius:2px; padding:24px; }
  .icon-group-head { display:flex; align-items:baseline; justify-content:space-between; }
  .ig-title { font-size:22px; font-weight:400; letter-spacing:-0.01em; }
  .icon-rule { color:var(--ink-mute); font-size:13.5px; line-height:1.6; margin:8px 0 22px; max-width:760px; text-wrap:pretty; }
  .icon-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px; }
  .icon-card { background:var(--bg); border:1px solid var(--rule); border-radius:2px; padding:16px; }
  .icon-well { width:52px; height:52px; border-radius:12px; background:var(--surface-2); border:1px solid var(--rule);
    display:grid; place-items:center; color:var(--ink); margin-bottom:14px; }
  .icon-well svg { width:28px; height:28px; }
  .icon-name { font-size:12px; color:var(--ink); }
  .icon-where { font-size:12.5px; font-weight:600; color:var(--accent); margin-top:5px; }
  .icon-concept { font-size:12px; color:var(--ink-mute); line-height:1.5; margin-top:5px; }

  /* components */
  .comp-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:18px; align-items:start; }
  .comp-title { font-size:19px; font-weight:400; letter-spacing:-0.01em; }
  .comp-demo { background:var(--bg); border:1px solid var(--rule); border-radius:2px; padding:20px; margin:4px 0 16px; }
  .comp-wide { grid-column:1 / -1; }
  .comp-subhead { grid-column:1 / -1; display:flex; align-items:baseline; justify-content:space-between; gap:14px; border-top:1px solid var(--rule); padding-top:20px; margin-top:8px; }
  .comp-subhead .ff-display { font-size:18px; font-weight:400; letter-spacing:-0.01em; color:var(--ink); }
  /* state specimens — one cell per state, spec read off the tile */
  .comp.states { grid-column:1 / -1; }
  .comp-purpose { font-size:13.5px; line-height:1.55; color:var(--ink-mute); margin:2px 0 18px; max-width:760px; text-wrap:pretty; }
  .state-grid { display:grid; gap:14px; }
  .state-cell { background:var(--bg); border:1px solid var(--rule); border-radius:2px; padding:16px; }
  .state-demo { min-height:84px; display:grid; place-items:center; padding:6px 0 16px; border-bottom:1px solid var(--rule); }
  .state-name { font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color:var(--accent); margin-top:14px; }
  .state-when { font-size:12.5px; line-height:1.5; color:var(--ink-mute); margin-top:6px; text-wrap:pretty; }
  .state-spec { display:flex; flex-wrap:wrap; gap:6px; margin-top:11px; }
  .spec-chip { font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:0.04em; color:var(--ink-mute); border:1px solid var(--rule); border-radius:999px; padding:3px 8px; white-space:nowrap; }
  .comp.states .rules { margin-top:18px; padding-top:16px; border-top:1px solid var(--rule); }
  .rules.tight { margin:0; padding-left:16px; }
  .rules.tight li { font-size:13px; line-height:1.5; margin-bottom:6px; }
  .rules.tight li:last-child { margin-bottom:0; }
  .tabbar-demo { display:grid; grid-template-columns:repeat(5,1fr); background:var(--surface); border:1px solid var(--rule); border-radius:2px; padding:10px 0; }
  .tabbar-demo .tab { display:flex; flex-direction:column; align-items:center; gap:5px; }
  .tab-ico svg { width:24px; height:24px; }

  /* flags */
  .flag { background:var(--surface); border:1px solid var(--rule); border-radius:2px; padding:22px 24px; border-left:3px solid var(--ink-mute); }
  .flag-high { border-left-color:var(--berry); }
  .flag-med { border-left-color:var(--warn); }
  .flag-low { border-left-color:var(--sage); }
  .flag-head { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:14px; }
  .sev { font-size:9.5px; letter-spacing:0.14em; text-transform:uppercase; padding:4px 9px; border-radius:999px; white-space:nowrap; }
  .flag-head .flag-title { flex:1; min-width:200px; }
  .sev-high { color:var(--berry); border:1px solid var(--berry); }
  .sev-med { color:var(--warn); border:1px solid var(--warn); }
  .sev-low { color:var(--sage); border:1px solid var(--sage); }
  .sev-done { color:var(--sage); border:1px solid var(--sage); background:color-mix(in oklab, var(--sage) 12%, transparent); }
  .flag-done { border-left-color:var(--sage); }
  .klabel.done { color:var(--sage); }
  .flag-title { font-size:18px; font-weight:400; letter-spacing:-0.01em; }
  .flag-body { display:flex; flex-direction:column; gap:12px; }
  .flag-body > div { display:grid; grid-template-columns:92px 1fr; gap:14px; }

  /* plus / paywall */
  .plus-pill { font-family:'IBM Plex Mono',monospace; font-size:8.5px; letter-spacing:0.16em; text-transform:uppercase; color:var(--accent); border:1px solid color-mix(in oklab, var(--accent) 45%, var(--rule)); border-radius:999px; padding:3px 8px; white-space:nowrap; }
  .trial-pill { display:inline-flex; align-items:center; gap:7px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--accent); background:color-mix(in oklab, var(--accent) 12%, var(--surface)); border:1px solid color-mix(in oklab, var(--accent) 30%, var(--rule)); border-radius:999px; padding:6px 12px; white-space:nowrap; }
  .trial-pill .dot { width:6px; height:6px; border-radius:999px; background:var(--accent); }
  .afford-row { display:flex; gap:30px; flex-wrap:wrap; align-items:flex-start; }
  .afford { display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center; }
  .afford .cap { font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-mute); }
  .lock-mini-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:18px; }
  .lock-mini { position:relative; aspect-ratio:9/16; border-radius:18px; overflow:hidden; border:1px solid var(--rule); background:var(--bg); }
  .lock-mini-cap { font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-mute); text-align:center; margin-top:10px; }
  @media (max-width:720px) { .lock-mini-grid { grid-template-columns:1fr; max-width:260px; margin:0 auto; } }

  @media (max-width:900px) {
    .shell { grid-template-columns:1fr; }
    #ds-nav { display:none; }
    #ds-main { padding:32px 24px 100px; }
    .hero, .topbar { padding-left:24px; padding-right:24px; }
    .hero h1 { font-size:38px; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <span class="mark">BrewPath</span>
      <span class="tag">Design System</span>
    </div>
    <div class="theme-toggle" id="theme-toggle">
      <button data-mood="dark-roast" class="active">Dark roast</button>
      <button data-mood="cupping">Cupping</button>
    </div>
  </div>

  <div class="hero">
    <div class="hero-inner">
      <div class="mono">ONE SYSTEM · TWO MOODS</div>
      <h1>Every colour, glyph and part — and where it belongs.</h1>
      <p>A living reference for BrewPath. Each entry states where it is used and the rule behind it, so nothing is chosen by feel. Toggle the mood to see the whole system reskin.</p>
    </div>
  </div>

  <div class="shell">
    <nav id="ds-nav"></nav>
    <main id="ds-main"></main>
  </div>

  <script>
    (function(){
      var tg = document.getElementById('theme-toggle');
      tg.addEventListener('click', function(e){
        var b = e.target.closest('button'); if(!b) return;
        document.documentElement.setAttribute('data-mood', b.dataset.mood);
        tg.querySelectorAll('button').forEach(function(x){ x.classList.toggle('active', x===b); });
      });
    })();
  </script>
  <script src="ds-content.js"></script>
</body>
</html>
