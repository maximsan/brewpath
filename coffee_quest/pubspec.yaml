name: coffee_quest
description: Coffee Quest — Duolingo-style coffee education app.
publish_to: 'none'
version: 1.0.0+1

environment:
  # Floor raised 3.3.0 → 3.8.0: required by json_serializable 6.13.x.
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Navigation
  go_router: ^17.2.3

  # Local persistence — Drift (SQLite). Replaced abandoned Isar 3.x.
  # drift_flutter pinned ^0.2.8 (not 0.3.0): 0.3.0 needs sqlite3 ^3, but
  # drift 2.30.x needs sqlite3 ^2.6. drift pinned <2.32 so drift_dev stays
  # in the analyzer-9 window shared with Riverpod 3 / Freezed 3.
  drift: ^2.30.1
  drift_flutter: ^0.2.8
  sqlite3_flutter_libs: ^0.5.42
  path_provider: ^2.1.5

  # Firebase — added in Phase 8 only (deferred; app is offline-first for MVP)
  # firebase_core: ^4.8.0
  # firebase_analytics: ^12.4.0
  # firebase_crashlytics: ^5.2.1
  # firebase_remote_config: ^6.5.0

  # Payments (placeholder — not active in MVP)
  in_app_purchase: ^3.2.3

  # Ads — disabled for MVP; re-enable in Phase 8 (see docs/11-ads.md)
  # google_mobile_ads: ^8.0.0

  # Utilities
  freezed_annotation: ^3.1.0
  # ^4.11.0 (not plan's ^4.12.0): json_serializable 6.13.x requires
  # json_annotation <4.12.0. json_serializable ^6.13.0 is a HARD CONSTRAINT.
  json_annotation: ^4.11.0
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.3
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  drift_dev: ^2.30.1

  # Linting
  flutter_lints: ^6.0.0
  # TODO(deps): Re-add riverpod_lint + custom_lint when custom_lint
  # supports analyzer >=9. Ecosystem gap as of May 2026.
  # Tracking: https://github.com/invertase/dart_custom_lint

flutter:
  uses-material-design: true
  assets:
    - assets/content/
    - assets/images/
    - assets/icons/
