name: brew_path
description: BrewPath — Duolingo-style coffee education app.
publish_to: "none"
version: 1.0.0+3

environment:
  # Floor raised 3.3.0 → 3.8.0: required by json_serializable 6.13.x.
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  # Navigation
  go_router: ^17.2.3

  # Local persistence — Drift (SQLite). Replaced abandoned Isar 3.x.
  drift: ^2.33.0
  drift_flutter: ^0.3.0
  sqlite3_flutter_libs: ^0.6.0
  path_provider: ^2.1.5

  # Firebase — Phase 8. Code is wired but inactive until `kUseFirebase`
  # (lib/core/config/firebase_flags.dart) is flipped after flutterfire setup.
  firebase_core: ^4.8.0
  firebase_analytics: ^12.4.0
  firebase_crashlytics: ^5.2.1
  firebase_remote_config: ^6.5.0

  # Payments (placeholder — not active in MVP)
  in_app_purchase: ^3.2.3

  # Ads — disabled for MVP; re-enable in Phase 8 (see docs/11-ads.md)
  # google_mobile_ads: ^8.0.0

  # Utilities
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  collection: ^1.19.1

  # App version string on the Profile screen (Phase 6)
  package_info_plus: ^10.1.0

  # Welcome-screen hero Variant B (seed-to-tree video). Removed at Step 11 if
  # this variant is not chosen.
  video_player: ^2.9.1
  share_plus: ^13.3.0
  showcaseview: ^5.1.0

  # The design system's own 24x24 icon family, written to assets/icons/ by
  # tool/extract_icons.js as real SVG. The marks carry arcs, transforms,
  # per-element opacity and nine stroke widths, so they are rendered rather
  # than transcribed into painters; `currentColor` is what lets one asset
  # follow the mood.
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Deterministic timer control for unit tests
  fake_async: ^1.3.3

  # Scratch paths for the extractor's subprocess test. Already resolved
  # transitively; declared so the direct import is legitimate.
  path: ^1.9.0

  # A stand-in video platform, so the Welcome film and the controls on it are
  # reachable under `flutter test` — the real decoders are native and never
  # register in `flutter_tester`. Same story as `path` above: already resolved
  # through `video_player`, declared so the direct import is legitimate.
  video_player_platform_interface: ^6.6.0
  plugin_platform_interface: ^2.1.8

  # Code generation
  build_runner: ^2.15.0
  # riverpod_generator / freezed: analyzer-12 support ships on the -dev line
  # (stable is still analyzer ^9 / <11).
  riverpod_generator: ^4.0.4
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.0
  drift_dev: ^2.33.0
  very_good_analysis: ^10.2.0
  dart_code_linter: ^4.1.2

  # Linting
flutter:
  uses-material-design: true
  assets:
    - assets/content/
    # Written by tool/extract_content.js from the prototype source. Listed
    # separately because a directory entry bundles its own files only, not
    # those of its subdirectories.
    - assets/content/generated/
    - assets/images/
    # The Coffee Tree's ten stage frames — the prototype's shipped raster art,
    # one set shared by every grove variety (#136).
    - assets/images/trees/
    - assets/icons/
    - assets/video/

  # Declared as real font assets rather than fetched at runtime, so there is no
  # network path to fail on. Weights are limited to what the app renders — the
  # design's stylesheet also loads Fraunces 300/500 and Plex Sans 600, but those
  # appear only in its `[data-voice]` exploration variants and in standalone
  # showcase documents, never in the shipped default. See docs/design and #36.
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Regular.ttf
          weight: 400
        - asset: assets/fonts/Fraunces-Italic.ttf
          weight: 400
          style: italic
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
