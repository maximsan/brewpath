name: CI

on:
  push:
    branches: [main]
    # Prose changes nothing a build or a test can check, and a markdown-only
    # commit to main used to cost 169 charged minutes — the whole pipeline,
    # smoke included. Duplicated rather than shared through a YAML anchor,
    # which the Actions parser does not support. prototype/ is deliberately
    # absent: two tool tests read its sources, so an edit there can fail CI.
    paths-ignore:
      - "docs/**"
      - "learning/**"
      - "**/*.md"
      - ".claude/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "learning/**"
      - "**/*.md"
      - ".claude/**"
  # Run by hand on any branch, which is also how a prose-only change gets the
  # checks the paths-ignore above skips.
  workflow_dispatch:

# A second push supersedes the first, so an iterated branch pays for its
# latest commit rather than for every commit. Pushes to main are never
# cancelled: each one is the commit that has to be known good.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.1"

jobs:
  # Linux only. The iOS build and the simulator smoke suite live in
  # codemagic.yaml: GitHub bills a macOS runner at ten times Linux and
  # rounds every job up, so those two cost 150 charged minutes per push to
  # main here against 14 real ones there. docs/ci-cd.md has the split.
  # One job, not four. Each separate job paid its own checkout, its own
  # Flutter install and its own rounded-up billing minute for work that took
  # seconds — three minutes a run before either runner did anything. The
  # cheap checks run first so a formatting slip still fails in under a
  # minute, and only then does the fifteen-minute suite start.
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history: the changelog and comment checks diff against the merge
      # base, which a shallow clone does not contain.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # extract_content_test.dart shells out to `node`. The runner ships a Node
      # already, but pinning it makes the dependency explicit rather than an
      # accident of the image — and the script takes no npm packages, so there
      # is nothing to install.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Required for formatting, not just for analysis: `dart format` picks its
      # style from the package's language version, which it can only read via
      # .dart_tool/package_config.json. Without this step it falls back to the
      # newest language version and reformats files that are correctly
      # formatted at the pubspec's 3.8 floor.
      - name: Install dependencies
        run: flutter pub get

      # Pull requests only: the check compares a branch against its base, and by
      # the time a commit is on main it has already been through it. Skipped
      # when the PR carries the `no-changelog` label — the escape hatch for
      # refactors, formatting passes and regenerated output, which the changelog
      # deliberately does not record.
      - name: Require a changelog entry for product changes
        if: >
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'no-changelog')
        run: tool/check_changelog.sh "${{ github.event.pull_request.base.sha }}"

      # Pull requests only: every Dart file the branch touches must be clean of
      # over-long comment blocks. Older overruns drain as their files are
      # touched, so there is no sweep and no allow-list to maintain.
      - name: Comment blocks in changed files stay under the cap
        if: github.event_name == 'pull_request'
        run: dart tool/check_comments.dart --changed "${{ github.event.pull_request.base.sha }}"

      # Scoped to source dirs — `dart format .` would descend into build/
      # (Firebase plugins copy example apps there with broken includes).
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool

      - name: Analyze
        run: flutter analyze

      # dart_code_linter's per-function metrics (source-lines-of-code,
      # cyclomatic-complexity, nesting, parameter/method counts) aren't surfaced
      # by `flutter analyze` — run the CLI gate so metric breaches fail CI.
      # no-magic-number is a plugin rule, already enforced by Analyze above.
      - name: Metrics (dart_code_linter)
        run: >
          dart run dart_code_linter:metrics analyze lib
          --set-exit-on-violation-level=warning

      # Runs every *_test.dart under test/ recursively, including the
      # Drift schema smoke/UNIQUE tests in test/database/. Generated
      # helpers are committed, so no codegen step is required here.
      - name: Test
        run: flutter test
